name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  workflow_dispatch:

jobs:
  dist:
    name: build dist tarball
    runs-on: ubuntu-latest
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@v5

      - name: install build deps + compressors
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            autoconf-archive libtool-bin build-essential pkg-config \
            xz-utils bzip2 bzip3 zip

      - name: build + install autoconf 2.73 and automake 1.18.1 from source
        run: |
          cd /tmp
          curl -fsSL https://ftp.gnu.org/gnu/autoconf/autoconf-2.73.tar.gz | tar xz
          cd autoconf-2.73 && ./configure --prefix=/usr/local && make && sudo make install
          cd /tmp
          curl -fsSL https://ftp.gnu.org/gnu/automake/automake-1.18.1.tar.gz | tar xz
          cd automake-1.18.1 && ./configure --prefix=/usr/local && make && sudo make install
          hash -r

      - name: bootstrap + configure + make dist
        run: |
          ./bootstrap
          ./configure
          make dist

      - name: upload tarballs
        uses: actions/upload-artifact@v6
        with:
          name: fastent-dist
          path: |
            fastent-*.tar.gz
            fastent-*.tar.xz
            fastent-*.tar.bz2
            fastent-*.tar.bz3
            fastent-*.zip
          if-no-files-found: error

  build-from-dist:
    name: build + test (from dist tarball)
    needs: dist
    runs-on: ubuntu-latest
    env:
      CC: gcc
    steps:
      - name: install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential python3

      - name: download tarball
        uses: actions/download-artifact@v6
        with:
          name: fastent-dist

      - name: unpack
        run: |
          tar xzf fastent-*.tar.gz
          ln -s fastent-*/ fastent-src

      - name: configure + build
        working-directory: fastent-src
        run: |
          ./configure --enable-lto
          make -j"$(nproc)"

      - name: smoke the binary
        working-directory: fastent-src
        run: |
          ./fastent --version
          dd if=/dev/urandom bs=4096 count=4 status=none > /tmp/smoke.bin
          ./fastent -t  /tmp/smoke.bin
          ./fastent -tb /tmp/smoke.bin
          ./fastent -tf /tmp/smoke.bin
          ./fastent --json /tmp/smoke.bin | python3 -c \
            "import json,sys; json.loads(sys.stdin.read())"

      - name: make check
        working-directory: fastent-src
        run: make check

  # Cross-compile static, dependency-free binaries with zig cc.  Each
  # matrix entry builds an out-of-tree fastent for one target out of
  # the dist tarball, smoke-tests the artifact under qemu-user-static
  # or wine where feasible, and uploads it as a CI artifact.  All
  # outputs are statically linked (musl on Linux, mingw-w64 on
  # Windows) except macOS, which links against the bundled SDK stubs
  # because Apple does not ship static libSystem.
  cross-binaries:
    name: zig cc / ${{ matrix.target.id }}
    needs: dist
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          # Linux (musl, fully static).
          - { id: linux-x86_64,           zig: x86_64-linux-musl,         host: x86_64-unknown-linux-musl,         lto: 1, ldflags: "-static -s", bin: fastent,     qemu: qemu-x86_64-static     }
          - { id: linux-i386,             zig: x86-linux-musl,            host: x86-unknown-linux-musl,            lto: 1, ldflags: "-static -s", bin: fastent,     qemu: qemu-i386-static       }
          - { id: linux-aarch64,          zig: aarch64-linux-musl,        host: aarch64-unknown-linux-musl,        lto: 1, ldflags: "-static -s", bin: fastent,     qemu: qemu-aarch64-static    }
          - { id: linux-armhf,            zig: arm-linux-musleabihf,      host: arm-unknown-linux-musleabihf,      lto: 1, ldflags: "-static -s", bin: fastent,     qemu: qemu-arm-static        }
          # LTO is disabled on riscv64 and loongarch64: with the LLVM
          # 18 shipped by zig 0.14.0, ld.lld rejects mixing the
          # freshly-emitted IR's target-abi metadata against the
          # precompiled crt1.o (lp64d on both archs).  Re-enable when
          # the toolchain bump lands.
          - { id: linux-riscv64,          zig: riscv64-linux-musl,        host: riscv64-unknown-linux-musl,        lto: 0, ldflags: "-static -s", bin: fastent,     qemu: qemu-riscv64-static    }
          - { id: linux-powerpc64le,      zig: powerpc64le-linux-musl,    host: powerpc64le-unknown-linux-musl,    lto: 1, ldflags: "-static -s", bin: fastent,     qemu: qemu-ppc64le-static    }
          - { id: linux-powerpc,          zig: powerpc-linux-musleabihf,  host: powerpc-unknown-linux-musleabihf,  lto: 1, ldflags: "-static -s", bin: fastent,     qemu: qemu-ppc-static        }
          - { id: linux-s390x,            zig: s390x-linux-musl,          host: s390x-ibm-linux-musl,              lto: 1, ldflags: "-static -s", bin: fastent,     qemu: qemu-s390x-static      }
          - { id: linux-loongarch64,      zig: loongarch64-linux-musl,    host: loongarch64-unknown-linux-musl,    lto: 0, ldflags: "-static -s", bin: fastent,     qemu: qemu-loongarch64-static }
          - { id: linux-mips,             zig: mips-linux-musleabihf,     host: mips-unknown-linux-musleabihf,     lto: 1, ldflags: "-static -s", bin: fastent,     qemu: qemu-mips-static       }
          - { id: linux-mipsel,           zig: mipsel-linux-musleabihf,   host: mipsel-unknown-linux-musleabihf,   lto: 1, ldflags: "-static -s", bin: fastent,     qemu: qemu-mipsel-static     }
          - { id: linux-mips64,           zig: mips64-linux-muslabi64,    host: mips64-unknown-linux-musl,         lto: 1, ldflags: "-static -s", bin: fastent,     qemu: qemu-mips64-static     }
          - { id: linux-mips64el,         zig: mips64el-linux-muslabi64,  host: mips64el-unknown-linux-musl,       lto: 1, ldflags: "-static -s", bin: fastent,     qemu: qemu-mips64el-static   }
          # Windows (mingw-w64, fully static).
          - { id: windows-x86_64,         zig: x86_64-windows-gnu,        host: x86_64-w64-mingw32,                lto: 1, ldflags: "-static -s", bin: fastent.exe, qemu: ""                     }
          - { id: windows-i686,           zig: x86-windows-gnu,           host: i686-w64-mingw32,                  lto: 1, ldflags: "-static -s", bin: fastent.exe, qemu: ""                     }
          - { id: windows-aarch64,        zig: aarch64-windows-gnu,       host: aarch64-w64-mingw32,               lto: 1, ldflags: "-static -s", bin: fastent.exe, qemu: ""                     }
          # macOS (libSystem stub, not fully static).
          - { id: macos-x86_64,           zig: x86_64-macos-none,         host: x86_64-apple-darwin,               lto: 1, ldflags: "-s",         bin: fastent,     qemu: ""                     }
          - { id: macos-aarch64,          zig: aarch64-macos-none,        host: aarch64-apple-darwin,              lto: 1, ldflags: "-s",         bin: fastent,     qemu: ""                     }
    steps:
      - name: install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - name: install qemu-user-static (for non-native linux smoke test)
        if: startsWith(matrix.target.id, 'linux-') && matrix.target.id != 'linux-x86_64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-user-static

      - name: download tarball
        uses: actions/download-artifact@v6
        with:
          name: fastent-dist

      - name: unpack
        run: |
          tar xzf fastent-*.tar.gz
          ln -s fastent-*/ fastent-src

      - name: configure + build
        env:
          ZIGT: ${{ matrix.target.zig }}
          HOSTT: ${{ matrix.target.host }}
          LDFLAGS_X: ${{ matrix.target.ldflags }}
          LTO: ${{ matrix.target.lto }}
        run: |
          mkdir build && cd build
          cfg_extra=""
          if [ "$LTO" = "1" ]; then cfg_extra="$cfg_extra --enable-lto"; fi
          ../fastent-src/configure \
            CC="zig cc -target $ZIGT" \
            AR="zig ar" \
            RANLIB="zig ranlib" \
            --host="$HOSTT" \
            $cfg_extra \
            LDFLAGS="$LDFLAGS_X"
          make -j"$(nproc)"

      - name: smoke test
        env:
          QEMU: ${{ matrix.target.qemu }}
          BIN: ${{ matrix.target.bin }}
          ID: ${{ matrix.target.id }}
        run: |
          set -euo pipefail
          cd build
          file "./$BIN"
          # Pick the right runner: native, qemu-user-static (Linux
          # non-native), or skip entirely (Windows/macOS, since we
          # can't ship a wine/darling toolchain on a vanilla runner).
          run=""
          case "$ID" in
            linux-x86_64) run="" ;;
            linux-i386)   run="" ;;     # i386 runs on x86_64 kernel
            linux-*)      run="$QEMU" ;;
            windows-*|macos-*) echo "skipping execution smoke for $ID"; exit 0 ;;
          esac
          dd if=/dev/urandom bs=4096 count=8 status=none > /tmp/smoke.bin
          $run "./$BIN" --version
          $run "./$BIN" -t  /tmp/smoke.bin
          $run "./$BIN" -tb /tmp/smoke.bin
          $run "./$BIN" -tf /tmp/smoke.bin

      - name: package binary
        env:
          BIN: ${{ matrix.target.bin }}
          ID: ${{ matrix.target.id }}
        run: |
          ver=$(ls -d fastent-*/ | head -1 | sed 's,/,,;s/^fastent-//')
          name="fastent-${ver}-${ID}"
          mkdir -p "dist/$name"
          cp "build/$BIN" "dist/$name/"
          cp fastent-src/README.md fastent-src/COPYING fastent-src/NEWS \
             fastent-src/fastent.1 "dist/$name/"
          case "$ID" in
            windows-*) (cd dist && zip -9 -r "${name}.zip" "$name") ;;
            *)         (cd dist && tar -czf "${name}.tar.gz" "$name") ;;
          esac

      - name: upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: fastent-${{ matrix.target.id }}
          path: |
            dist/fastent-*-${{ matrix.target.id }}.tar.gz
            dist/fastent-*-${{ matrix.target.id }}.zip
          if-no-files-found: error
