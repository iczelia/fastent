name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  workflow_dispatch:

jobs:
  dist:
    name: build dist tarball
    runs-on: ubuntu-latest
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps + compressors
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            autoconf-archive libtool-bin build-essential pkg-config \
            xz-utils bzip2 bzip3 zip

      - name: Build + install autoconf 2.73 and automake 1.18.1 from source
        run: |
          cd /tmp
          curl -fsSL https://ftp.gnu.org/gnu/autoconf/autoconf-2.73.tar.gz | tar xz
          cd autoconf-2.73 && ./configure --prefix=/usr/local && make && sudo make install
          cd /tmp
          curl -fsSL https://ftp.gnu.org/gnu/automake/automake-1.18.1.tar.gz | tar xz
          cd automake-1.18.1 && ./configure --prefix=/usr/local && make && sudo make install
          hash -r

      - name: Bootstrap + configure + make dist
        run: |
          ./bootstrap
          ./configure
          make dist

      - name: Upload tarballs
        uses: actions/upload-artifact@v7
        with:
          name: fastent-dist
          path: |
            fastent-*.tar.gz
            fastent-*.tar.xz
            fastent-*.tar.bz2
            fastent-*.tar.bz3
            fastent-*.zip
          if-no-files-found: error

  build-from-dist:
    name: build + test (from dist tarball)
    needs: dist
    runs-on: ubuntu-latest
    env:
      CC: gcc
    steps:
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential python3

      - name: Download tarball
        uses: actions/download-artifact@v7
        with:
          name: fastent-dist

      - name: Unpack
        run: |
          tar xzf fastent-*.tar.gz
          ln -s fastent-*/ fastent-src

      - name: Configure + build
        working-directory: fastent-src
        run: |
          ./configure --enable-lto
          make -j"$(nproc)"

      - name: Sanity check
        working-directory: fastent-src
        run: |
          ./fastent --version
          dd if=/dev/urandom bs=4096 count=4 status=none > /tmp/sanity.bin
          ./fastent -t  /tmp/sanity.bin
          ./fastent -tb /tmp/sanity.bin
          ./fastent -tf /tmp/sanity.bin
          ./fastent --json /tmp/sanity.bin | python3 -c \
            "import json,sys; json.loads(sys.stdin.read())"

      - name: Make check
        working-directory: fastent-src
        run: make check

  #  Cross-compile static binaries with zig cc, one per matrix entry.
  cross-binaries:
    name: zig cc / ${{ matrix.target.id }}
    needs: dist
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          #  Linux (musl, fully static).
          - { id: linux-x86_64,           zig: x86_64-linux-musl,         host: x86_64-unknown-linux-musl,         lto: 1, ldflags: "-static -s", bin: fastent,     qemu: qemu-x86_64-static     }
          - { id: linux-i386,             zig: x86-linux-musl,            host: x86-unknown-linux-musl,            lto: 1, ldflags: "-static -s", bin: fastent,     qemu: qemu-i386-static       }
          - { id: linux-aarch64,          zig: aarch64-linux-musl,        host: aarch64-unknown-linux-musl,        lto: 1, ldflags: "-static -s", bin: fastent,     qemu: qemu-aarch64-static    }
          - { id: linux-armhf,            zig: arm-linux-musleabihf,      host: arm-unknown-linux-musleabihf,      lto: 1, ldflags: "-static -s", bin: fastent,     qemu: qemu-arm-static        }
          #  LTO off on riscv64/loongarch64: ld.lld target-abi mismatch with crt1.o.
          - { id: linux-riscv64,          zig: riscv64-linux-musl,        host: riscv64-unknown-linux-musl,        lto: 0, ldflags: "-static -s", bin: fastent,     qemu: qemu-riscv64-static    }
          - { id: linux-powerpc64le,      zig: powerpc64le-linux-musl,    host: powerpc64le-unknown-linux-musl,    lto: 1, ldflags: "-static -s", bin: fastent,     qemu: qemu-ppc64le-static    }
          - { id: linux-powerpc64,        zig: powerpc64-linux-musl,      host: powerpc64-unknown-linux-musl,      lto: 1, ldflags: "-static -s", bin: fastent,     qemu: qemu-ppc64-static      }
          - { id: linux-powerpc,          zig: powerpc-linux-musleabihf,  host: powerpc-unknown-linux-musleabihf,  lto: 1, ldflags: "-static -s", bin: fastent,     qemu: qemu-ppc-static        }
          - { id: linux-s390x,            zig: s390x-linux-musl,          host: s390x-ibm-linux-musl,              lto: 1, ldflags: "-static -s", bin: fastent,     qemu: qemu-s390x-static      }
          - { id: linux-loongarch64,      zig: loongarch64-linux-musl,    host: loongarch64-unknown-linux-musl,    lto: 0, ldflags: "-static -s", bin: fastent,     qemu: qemu-loongarch64-static }
          - { id: linux-mips,             zig: mips-linux-musleabihf,     host: mips-unknown-linux-musleabihf,     lto: 1, ldflags: "-static -s", bin: fastent,     qemu: qemu-mips-static       }
          - { id: linux-mipsel,           zig: mipsel-linux-musleabihf,   host: mipsel-unknown-linux-musleabihf,   lto: 1, ldflags: "-static -s", bin: fastent,     qemu: qemu-mipsel-static     }
          - { id: linux-mips64,           zig: mips64-linux-muslabi64,    host: mips64-unknown-linux-musl,         lto: 1, ldflags: "-static -s", bin: fastent,     qemu: qemu-mips64-static     }
          - { id: linux-mips64el,         zig: mips64el-linux-muslabi64,  host: mips64el-unknown-linux-musl,       lto: 1, ldflags: "-static -s", bin: fastent,     qemu: qemu-mips64el-static   }
          #  Windows (mingw-w64, fully static).
          - { id: windows-x86_64,         zig: x86_64-windows-gnu,        host: x86_64-w64-mingw32,                lto: 1, ldflags: "-static -s", bin: fastent.exe, qemu: ""                     }
          - { id: windows-i686,           zig: x86-windows-gnu,           host: i686-w64-mingw32,                  lto: 1, ldflags: "-static -s", bin: fastent.exe, qemu: ""                     }
          - { id: windows-aarch64,        zig: aarch64-windows-gnu,       host: aarch64-w64-mingw32,               lto: 1, ldflags: "-static -s", bin: fastent.exe, qemu: ""                     }
          #  macOS (libSystem stub, not fully static).
          - { id: macos-x86_64,           zig: x86_64-macos-none,         host: x86_64-apple-darwin,               lto: 1, ldflags: "-s",         bin: fastent,     qemu: ""                     }
          - { id: macos-aarch64,          zig: aarch64-macos-none,        host: aarch64-apple-darwin,              lto: 1, ldflags: "-s",         bin: fastent,     qemu: ""                     }
    steps:
      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - name: Install qemu-user-static (for non-native linux sanity check)
        if: startsWith(matrix.target.id, 'linux-') && matrix.target.id != 'linux-x86_64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-user-static

      - name: Download tarball
        uses: actions/download-artifact@v7
        with:
          name: fastent-dist

      - name: Unpack
        run: |
          tar xzf fastent-*.tar.gz
          ln -s fastent-*/ fastent-src

      - name: Configure + build
        env:
          ZIGT: ${{ matrix.target.zig }}
          HOSTT: ${{ matrix.target.host }}
          LDFLAGS_X: ${{ matrix.target.ldflags }}
          LTO: ${{ matrix.target.lto }}
        run: |
          mkdir build && cd build
          cfg_extra=""
          if [ "$LTO" = "1" ]; then cfg_extra="$cfg_extra --enable-lto"; fi
          ../fastent-src/configure \
            CC="zig cc -target $ZIGT" \
            AR="zig ar" \
            RANLIB="zig ranlib" \
            --host="$HOSTT" \
            $cfg_extra \
            LDFLAGS="$LDFLAGS_X"
          make -j"$(nproc)"

      - name: Sanity check
        env:
          QEMU: ${{ matrix.target.qemu }}
          BIN: ${{ matrix.target.bin }}
          ID: ${{ matrix.target.id }}
        run: |
          set -euo pipefail
          cd build
          file "./$BIN"
          #  native, qemu-user-static, or skip (Windows/macOS).
          run=""
          case "$ID" in
            linux-x86_64) run="" ;;
            linux-i386)   run="" ;;     # i386 runs on x86_64 kernel
            linux-*)      run="$QEMU" ;;
            windows-*|macos-*) echo "skipping sanity check for $ID"; exit 0 ;;
          esac
          dd if=/dev/urandom bs=4096 count=8 status=none > /tmp/sanity.bin
          $run "./$BIN" --version
          $run "./$BIN" -t  /tmp/sanity.bin
          $run "./$BIN" -tb /tmp/sanity.bin
          $run "./$BIN" -tf /tmp/sanity.bin

      - name: Package binary
        env:
          BIN: ${{ matrix.target.bin }}
          ID: ${{ matrix.target.id }}
        run: |
          ver=$(ls -d fastent-*/ | head -1 | sed 's,/,,;s/^fastent-//')
          name="fastent-${ver}-${ID}"
          mkdir -p "dist/$name"
          cp "build/$BIN" "dist/$name/"
          cp fastent-src/README.md fastent-src/COPYING fastent-src/NEWS \
             fastent-src/fastent.1 "dist/$name/"
          case "$ID" in
            windows-*) (cd dist && zip -9 -r "${name}.zip" "$name") ;;
            *)         (cd dist && tar -czf "${name}.tar.gz" "$name") ;;
          esac

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: fastent-${{ matrix.target.id }}
          path: |
            dist/fastent-*-${{ matrix.target.id }}.tar.gz
            dist/fastent-*-${{ matrix.target.id }}.zip
          if-no-files-found: error

  cross-binaries-gcc:
    name: gcc-cross / ${{ matrix.target.id }}
    needs: dist
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          #  sparc32: sparc64 gcc + -m32 (sparcv8plus); -m32 in CC.
          #  SH3, C-SKY: no Debian multilib / cross-gcc; skipped.
          #  alpha libc package is libc6.1-dev (DEC SONAME quirk).
          - { id: linux-alpha,   apt: "gcc-alpha-linux-gnu libc6.1-dev-alpha-cross",                                                  cc: "alpha-linux-gnu-gcc",        host: alpha-linux-gnu,   lto: 1 }
          - { id: linux-sparc64, apt: "gcc-sparc64-linux-gnu libc6-dev-sparc64-cross",                                                cc: "sparc64-linux-gnu-gcc",      host: sparc64-linux-gnu, lto: 1 }
          - { id: linux-sparc,   apt: "gcc-sparc64-linux-gnu gcc-multilib-sparc64-linux-gnu",                                          cc: "sparc64-linux-gnu-gcc -m32", host: sparc-linux-gnu,   lto: 1 }
          - { id: linux-m68k,    apt: "gcc-m68k-linux-gnu libc6-dev-m68k-cross",                                                      cc: "m68k-linux-gnu-gcc",         host: m68k-linux-gnu,    lto: 1 }
          - { id: linux-hppa,    apt: "gcc-hppa-linux-gnu libc6-dev-hppa-cross",                                                      cc: "hppa-linux-gnu-gcc",         host: hppa-linux-gnu,    lto: 1 }
          - { id: linux-arc,     apt: "gcc-arc-linux-gnu libc6-dev-arc-cross",                                                        cc: "arc-linux-gnu-gcc",          host: arc-linux-gnu,     lto: 1 }
          - { id: linux-sh4,     apt: "gcc-sh4-linux-gnu libc6-dev-sh4-cross",                                                        cc: "sh4-linux-gnu-gcc",          host: sh4-linux-gnu,     lto: 1 }
    steps:
      - name: Install cross toolchain
        env:
          APT: ${{ matrix.target.apt }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $APT

      - name: Download tarball
        uses: actions/download-artifact@v7
        with:
          name: fastent-dist

      - name: Unpack
        run: |
          tar xzf fastent-*.tar.gz
          ln -s fastent-*/ fastent-src

      - name: Configure + build
        env:
          CCBIN: ${{ matrix.target.cc }}
          HOSTT: ${{ matrix.target.host }}
          LTO: ${{ matrix.target.lto }}
        run: |
          mkdir build && cd build
          cfg_extra=""
          if [ "$LTO" = "1" ]; then cfg_extra="$cfg_extra --enable-lto"; fi
          ../fastent-src/configure \
            CC="$CCBIN" \
            LDFLAGS="-static -s" \
            --host="$HOSTT" \
            $cfg_extra
          make -j"$(nproc)"

      - name: Report binary
        env:
          ID: ${{ matrix.target.id }}
        run: |
          cd build
          file ./fastent
          ls -la ./fastent

      - name: Package binary
        env:
          ID: ${{ matrix.target.id }}
        run: |
          ver=$(ls -d fastent-*/ | head -1 | sed 's,/,,;s/^fastent-//')
          name="fastent-${ver}-${ID}"
          mkdir -p "dist/$name"
          cp "build/fastent" "dist/$name/"
          cp fastent-src/README.md fastent-src/COPYING fastent-src/NEWS \
             fastent-src/fastent.1 "dist/$name/"
          (cd dist && tar -czf "${name}.tar.gz" "$name")

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: fastent-${{ matrix.target.id }}
          path: dist/fastent-*-${{ matrix.target.id }}.tar.gz
          if-no-files-found: error

  #  Win95: Debian i686-w64-mingw32 (msvcrt CRT, not zig's UCRT).
  cross-binaries-win95:
    name: gcc-mingw / windows-i686-win95
    needs: dist
    runs-on: ubuntu-latest
    steps:
      - name: Install mingw32 cross + wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-i686 binutils-mingw-w64-i686 \
            wine wine32:i386

      - name: Download tarball
        uses: actions/download-artifact@v7
        with:
          name: fastent-dist

      - name: Unpack
        run: |
          tar xzf fastent-*.tar.gz
          ln -s fastent-*/ fastent-src

      - name: Configure + build
        run: |
          mkdir build && cd build
          ../fastent-src/configure \
            CC=i686-w64-mingw32-gcc \
            --host=i686-w64-mingw32 \
            --with-windows-target=win95 \
            --disable-threads \
            LDFLAGS="-static -s"
          make -j"$(nproc)"

      - name: Verify PE header advertises Windows 4.00
        run: |
          cd build
          file ./fastent.exe
          i686-w64-mingw32-objdump -p ./fastent.exe | \
            grep -E 'MajorOSystemVersion|MinorOSystemVersion|MajorSubsystemVersion|MinorSubsystemVersion'
          osmaj=$(i686-w64-mingw32-objdump -p ./fastent.exe | awk '/MajorOSystemVersion/{print $2}')
          submaj=$(i686-w64-mingw32-objdump -p ./fastent.exe | awk '/MajorSubsystemVersion/{print $2}')
          test "$osmaj" = "4" || { echo "expected OS major version 4, got $osmaj" >&2; exit 1; }
          test "$submaj" = "4" || { echo "expected subsystem major version 4, got $submaj" >&2; exit 1; }

      - name: Verify imports stay on the Win95 surface
        run: |
          cd build
          imports=$(i686-w64-mingw32-objdump -p ./fastent.exe \
                    | awk '/DLL Name:/ {print tolower($3)}' | sort -u)
          echo "imports: $imports"
          #  Expect only kernel32 + msvcrt.
          for d in $imports; do
            case "$d" in
              kernel32.dll|msvcrt.dll) ;;
              *) echo "unexpected import: $d" >&2; exit 1 ;;
            esac
          done

      - name: Sanity check under wine
        env:
          WINEDEBUG: -all
          #  Skip Mono/Gecko first-run prompts.
          WINEDLLOVERRIDES: "mscoree=;mshtml="
        run: |
          cd build
          wineboot --init 2>/dev/null || true
          dd if=/dev/urandom bs=4096 count=4 status=none > sanity.bin
          wine ./fastent.exe --version
          wine ./fastent.exe -t  sanity.bin
          wine ./fastent.exe -tb sanity.bin
          wine ./fastent.exe -tf sanity.bin

      - name: Package binary
        run: |
          ver=$(ls -d fastent-*/ | head -1 | sed 's,/,,;s/^fastent-//')
          name="fastent-${ver}-windows-i686-win95"
          mkdir -p "dist/$name"
          cp build/fastent.exe "dist/$name/"
          cp fastent-src/README.md fastent-src/COPYING fastent-src/NEWS \
             fastent-src/fastent.1 "dist/$name/"
          (cd dist && zip -9 -r "${name}.zip" "$name")

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: fastent-windows-i686-win95
          path: dist/fastent-*-windows-i686-win95.zip
          if-no-files-found: error

  #  MS-DOS via DJGPP + CWSDPMI; sanity-checked under DOSBox-X.
  cross-binaries-dos:
    name: djgpp / dos-i386
    needs: dist
    runs-on: ubuntu-latest
    env:
      DJGPP_RELEASE: "v3.4"
      DJGPP_GCC: "1220"
    steps:
      - name: Install DJGPP cross-toolchain
        run: |
          curl -fL -o /tmp/djgpp.tar.bz2 \
            "https://github.com/andrewwutw/build-djgpp/releases/download/${DJGPP_RELEASE}/djgpp-linux64-gcc${DJGPP_GCC}.tar.bz2"
          tar -xjf /tmp/djgpp.tar.bz2 -C "$HOME"
          echo "$HOME/djgpp/bin" >> $GITHUB_PATH
          #  Symlink exe2coff into the bin without shadowing host as/ld.
          exe2coff=$(find "$HOME/djgpp" -name exe2coff -type f -print -quit)
          test -n "$exe2coff" || { echo "exe2coff missing from DJGPP tarball" >&2; exit 1; }
          ln -sf "$exe2coff" "$HOME/djgpp/bin/exe2coff"

      - name: Install CWSDPMI (CWSDSTUB.EXE bundled into the final exe)
        run: |
          curl -fL -o /tmp/csdpmi.zip http://www.delorie.com/pub/djgpp/current/v2misc/csdpmi7b.zip
          unzip -j -d "$HOME/csdpmi" /tmp/csdpmi.zip 'bin/CWSDSTUB.EXE'
          echo "CWSDSTUB=$HOME/csdpmi/CWSDSTUB.EXE" >> $GITHUB_ENV

      - name: Install DOSBox-X (for headless sanity check)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dosbox-x

      - name: Download tarball
        uses: actions/download-artifact@v7
        with:
          name: fastent-dist

      - name: Unpack
        run: |
          tar xzf fastent-*.tar.gz
          ln -s fastent-*/ fastent-src

      - name: Configure + build (single-threaded, no SIMD)
        run: |
          mkdir build && cd build
          ../fastent-src/configure \
            --host=i586-pc-msdosdjgpp \
            CC=i586-pc-msdosdjgpp-gcc
          make -j"$(nproc)"

      - name: Verify DOS binary format
        run: |
          cd build
          file ./fastent.exe
          file ./fastent.exe | grep -Eq 'MS-DOS executable|COFF'

      - name: Sanity check under DOSBox-X
        run: |
          cd build
          dd if=/dev/urandom bs=4096 count=4 status=none > SANITY.BIN
          tmp=$(mktemp -d)
          #  DJGPP @file syntax dodges the 126-byte PSP limit.
          printf %s '-t SANITY.BIN' > "$tmp/args.rsp"
          sed -e "s|@PWD@|$PWD|g" -e "s|@OUT@|$tmp|g" \
            ../fastent-src/contrib/dos/dosbox-x.conf > "$tmp/dosbox-x.conf"
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            dosbox-x -silent -fastlaunch -nogui -nomenu \
                     -conf "$tmp/dosbox-x.conf" -exit >/dev/null 2>&1
          cat "$tmp/stdout.out"
          ec=$(tr -d ' \t\r\n' < "$tmp/ec.txt" 2>/dev/null || echo FAIL)
          test "$ec" = "OK" || { echo "DOS exec returned $ec"; exit 1; }

      - name: Package binary
        run: |
          ver=$(ls -d fastent-*/ | head -1 | sed 's,/,,;s/^fastent-//')
          name="fastent-${ver}-dos-i386"
          mkdir -p "dist/$name"
          cp build/fastent.exe "dist/$name/"
          cp fastent-src/README.md fastent-src/COPYING fastent-src/NEWS \
             fastent-src/fastent.1 "dist/$name/"
          (cd dist && zip -9 -r "${name}.zip" "$name")

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: fastent-dos-i386
          path: dist/fastent-*-dos-i386.zip
          if-no-files-found: error

  #  WebAssembly: emscripten with -sNODERAWFS, sanity-checked under node.
  #  wasm32 and wasm64 (-sMEMORY64); -msimd128 enables 128-bit SIMD
  #  codegen.  -sSINGLE_FILE folds the .wasm into the launcher .js as
  #  a self-contained artifact.  wasm64 needs node's experimental
  #  memory64 flag at run time.
  cross-binaries-wasm:
    name: emscripten / ${{ matrix.target.id }}
    needs: dist
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { id: wasm32, em_extra: ""           }
          - { id: wasm64, em_extra: "-sMEMORY64" }
    steps:
      - name: Install emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.74'

      - name: Install node 24 (V8 with table64 / memory64 support)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download tarball
        uses: actions/download-artifact@v7
        with:
          name: fastent-dist

      - name: Unpack
        run: |
          tar xzf fastent-*.tar.gz
          ln -s fastent-*/ fastent-src

      - name: Configure + build
        env:
          EMX: ${{ matrix.target.em_extra }}
        run: |
          mkdir build && cd build
          fl="-O3 -msimd128 -sNODERAWFS=1 -sSINGLE_FILE=1 -sEXIT_RUNTIME=1 $EMX"
          emconfigure ../fastent-src/configure \
            --host=wasm32-unknown-emscripten \
            --disable-threads \
            CFLAGS="$fl" \
            LDFLAGS="$fl"
          emmake make -j"$(nproc)"

      - name: Sanity check under node
        run: |
          cd build
          ls -la fastent*
          dd if=/dev/urandom bs=4096 count=4 status=none > sanity.bin
          node ./fastent --version
          node ./fastent -t  sanity.bin
          node ./fastent -tb sanity.bin
          node ./fastent -tf sanity.bin

      - name: Package binary
        env:
          ID: ${{ matrix.target.id }}
        run: |
          ver=$(ls -d fastent-*/ | head -1 | sed 's,/,,;s/^fastent-//')
          name="fastent-${ver}-wasi-${ID}"
          mkdir -p "dist/$name"
          cp build/fastent "dist/$name/fastent.js"
          cp fastent-src/README.md fastent-src/COPYING fastent-src/NEWS \
             fastent-src/fastent.1 "dist/$name/"
          (cd dist && tar -czf "${name}.tar.gz" "$name")

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: fastent-wasi-${{ matrix.target.id }}
          path: dist/fastent-*-wasi-${{ matrix.target.id }}.tar.gz
          if-no-files-found: error

  #  TinyCC: lets the scalar core compile under a minimal C compiler.
  #  SIMD probes auto-fail (no -mavx etc.), threads disabled.
  build-tcc:
    name: tcc / linux-x86_64
    needs: dist
    runs-on: ubuntu-latest
    steps:
      - name: Install tcc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tcc python3

      - name: Download tarball
        uses: actions/download-artifact@v7
        with:
          name: fastent-dist

      - name: Unpack
        run: |
          tar xzf fastent-*.tar.gz
          ln -s fastent-*/ fastent-src

      - name: Configure + build
        run: |
          mkdir build && cd build
          ../fastent-src/configure CC=tcc --disable-threads
          make -j"$(nproc)"

      - name: Sanity check
        run: |
          cd build
          file ./fastent
          ./fastent --version
          dd if=/dev/urandom bs=4096 count=4 status=none > /tmp/sanity.bin
          ./fastent -t  /tmp/sanity.bin
          ./fastent -tb /tmp/sanity.bin
          ./fastent -tf /tmp/sanity.bin
          ./fastent --json /tmp/sanity.bin | python3 -c \
            "import json,sys; json.loads(sys.stdin.read())"

      - name: Make check
        run: |
          cd build
          make check

  #  MSVC (cl.exe): native Windows runner, scalar + full x86 SIMD
  #  (SSSE3/SSE4.1/AVX2/AVX-512/BITALG) + Win32 threads. configure.ac's
  #  -m SIMD probes reject under cl, so this uses the dedicated
  #  build/msvc/Makefile.nmake instead of autotools.
  build-msvc:
    name: msvc / windows-x86_64
    needs: dist
    runs-on: windows-latest
    steps:
      - name: Download tarball
        uses: actions/download-artifact@v7
        with:
          name: fastent-dist

      - name: Unpack
        shell: bash
        run: |
          tar xzf fastent-*.tar.gz
          src=$(ls -d fastent-*/ | head -1 | sed 's,/$,,')
          echo "SRCDIR=$src" >> "$GITHUB_ENV"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build (nmake + cl)
        shell: cmd
        run: |
          cd %SRCDIR%
          nmake /f build\msvc\Makefile.nmake
          dir fastent.exe

      - name: Sanity check
        shell: bash
        run: |
          cd "$SRCDIR"
          ./fastent.exe --version
          dd if=/dev/urandom bs=4096 count=8 status=none > sanity.bin
          ./fastent.exe -t  sanity.bin
          ./fastent.exe -tb sanity.bin
          ./fastent.exe -tf sanity.bin
          ./fastent.exe --json sanity.bin | python -c \
            "import json,sys; json.loads(sys.stdin.read())"

      - name: Test suite (best effort under Git Bash)
        shell: bash
        continue-on-error: true
        run: |
          cd "$SRCDIR"
          bash tests/run-tests.sh ./fastent.exe tests/fixtures

      - name: Package binary
        shell: bash
        run: |
          ver=$(echo "$SRCDIR" | sed 's/^fastent-//')
          name="fastent-${ver}-windows-x86_64-msvc"
          mkdir -p "dist/$name"
          cp "$SRCDIR/fastent.exe" "dist/$name/"
          cp "$SRCDIR/README.md" "$SRCDIR/COPYING" "$SRCDIR/NEWS" \
             "$SRCDIR/fastent.1" "dist/$name/"
          (cd dist && 7z a "${name}.zip" "$name" >/dev/null)

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: fastent-windows-x86_64-msvc
          path: dist/fastent-*-windows-x86_64-msvc.zip
          if-no-files-found: error
