# DOSBox-X config for fastent CI tests.  @PWD@ / @OUT@ get sed-expanded
# at runtime: @PWD@ is the directory containing fastent.exe + the test
# fixture, @OUT@ is a scratch dir where stdout / errorlevel land so the
# host can pick them up.

[sdl]
output=surface

[dosbox]
memsize=32

[cpu]
cycles=max

[dos]
lfn=true
ver=7.1

[mixer]
nosound=true

[speaker]
pcspeaker=false
tandy=off
disney=false
ps1audio=off

[ide, primary]
int13fakeio=false
int13fakev86io=false

[autoexec]
mount d "@PWD@"
mount e "@OUT@"
d:
fastent.exe @e:\args.rsp > e:\stdout.out
if errorlevel 1 echo FAIL > e:\ec.txt
if not errorlevel 1 echo OK > e:\ec.txt
exit
